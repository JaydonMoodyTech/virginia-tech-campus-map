<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pixel Campus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="map"></canvas>
  <div id="controls">
    <button id="zoom-in" type="button" title="Zoom in (+)">+</button>
    <button id="zoom-out" type="button" title="Zoom out (-)">&minus;</button>
    <button id="fit" type="button" title="Fit whole campus (F)">FIT</button>
    <button id="bus" type="button" title="Blacksburg Transit (B)">BUS</button>
  </div>
  <aside id="transit" hidden></aside>
  <div id="hint">drag to pan &middot; click to zoom in &middot; FIT for all of campus</div>
  <div id="attribution">© OpenStreetMap contributors</div>
  <script type="module" src="main.js"></script>
</body>
</html>
